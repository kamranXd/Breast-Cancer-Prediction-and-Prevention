{% extends "base.html" %}

{% block page_title %}Login | Breast Cancer AI{% endblock %}

{% block extra_head %}
<style>
    .auth-wrapper { display: flex; justify-content: center; align-items: center; padding: 60px 20px; }
    .auth-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .auth-card h1 { color: #d81b60; margin-bottom: 20px; }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: 600; }
    .auth-card input { width: 100%; padding: 12px; border: 2px solid #fce4ec; border-radius: 10px; box-sizing: border-box; }
    .auth-card input:focus { outline: none; border-color: #f06292; }
    .btn-login { background-color: #d81b60; color: white; border: none; padding: 14px; width: 100%; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-login:hover { background-color: #ad1457; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Login</h1>

        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <p style="margin-top:20px; font-size:0.9rem;">New here? <a href="/signup" style="color:#d81b60; text-decoration:none; font-weight:bold;">Create an account</a></p>
    </div>
</div>
{% endblock %}
