<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body{ font-family: 'Segoe UI', sans-serif; background-color: #fce4ec; margin: 0; padding-top: 20px; }
        .navbar{
            background-color: #d81b60;
            padding: 15px 0;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            justify-content: center; 
            margin-bottom: 20px;
        }   
        .report-card{
            max-width: 600px;
            margin:100px auto 40px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            justify-content: center;
        }
        .header{ border-bottom: 2px solid #fce4ec; padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        .header h1{ color: #d81b60; margin: 0; }
        
        .status-badge{
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .low-risk{ background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .mod-risk{ background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .high-risk{ background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .section-title{ color: #555; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 10px; }
        .content-text{ font-size: 1.1rem; line-height: 1.6; color: #333; margin-bottom: 30px; }        
        .actions{ display: flex; gap: 15px; margin-top: 20px; }
        .btn{ flex: 1; padding: 12px; border-radius: 10px; text-decoration: none; text-align: center; font-weight: bold; transition: 0.3s; }
        .btn-primary{ background: #d81b60; color: white; }
        .btn-outline{ border: 2px solid #d81b60; color: #d81b60; }
        .btn:hover{ opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="report-card">
        <div class="header">
            <h1>Model Prediction</h1>
        </div>

        <div class="status-badge {{ risk_class }}">
            {{ prediction }}
        </div>

        <div class="section-title">What to do Next</div>
        <div class="content-text">
            {{ recommendation | safe}}
        </div>

        <div class="actions">
            <a href="/analyzer" class="btn btn-outline">New Analysis</a>
            <a href="/symptoms" class="btn btn-primary">Symptoms Guide</a>
        </div>
        
    </div>
</body>
</html>
